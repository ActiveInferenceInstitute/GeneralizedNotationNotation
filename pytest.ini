# =============================================================================
# GENERALIZED NOTATION NOTATION (GNN) - Pytest Configuration
# =============================================================================
# Comprehensive pytest configuration for the GNN pipeline testing framework
# Last Updated: 2026-01-21
# Pytest Version: >= 7.0.0
# =============================================================================

[pytest]

# =============================================================================
# TEST DISCOVERY AND COLLECTION
# =============================================================================

# Primary test directories
testpaths =
    tests

# Test file patterns
python_files =
    test_*.py
    *_test.py

# Test class and function patterns
python_classes =
    Test*
    *Tests
    *TestCase

python_functions =
    test_*

# Directories to ignore during collection
norecursedirs =
    .venv
    venv
    __pycache__
    .pytest_cache
    node_modules
    .git
    build
    dist
    output
    cache
    temp
    tmp

# =============================================================================
# TEST EXECUTION SETTINGS
# =============================================================================

# Core pytest options for consistent behavior
addopts =
    --strict-markers
    --strict-config
    --tb=short
    --durations=10
    --durations-min=1.0
    # maxfail canonical definition: 10 is the single suite-wide default for
    # plain `pytest` runs. Runner scripts pass their own `--maxfail=` on the
    # CLI, which overrides addopts (later flag wins) — intentional, documented
    # differences only: fast/reliable subsets use lower abort thresholds
    # (tests/run_fast_tests.py and tests/test_runner_modes.py use 5 and 3 to
    # bound the fast CI lane; tests/categories.py uses per-category
    # max_failures of 6/8/10/15 consumed by tests/infrastructure/test_runner.py
    # and utils.py). No other maxfail values should be introduced.
    --maxfail=10
    -p no:randomly
    -p no:sugar
    -p no:stepwise

# Minimum pytest version requirement
minversion = 7.0

# =============================================================================
# TEST TIMEOUTS AND PERFORMANCE
# =============================================================================

# Global timeout settings
# Limitation: timeout_method=thread cannot interrupt C extensions or blocking
# subprocess waits. Long-running pipeline tests are bounded by the outer 600s
# CI wrapper instead; switching to SIGALRM would break C-ext tests mid-flight.
timeout = 300
timeout_method = thread

# Asyncio: strict mode (default). All async tests in the suite (tests/api/
# test_api_endpoints.py, tests/gui/test_websocket_bridge.py, tests/llm/
# test_llm_pipeline_model_wiring.py — 6 total) carry explicit
# @pytest.mark.asyncio markers and there are no async fixtures, so auto mode
# (which silently collects unmarked async tests) was dropped.
asyncio_default_fixture_loop_scope = function

# =============================================================================
# TEST MARKERS
# =============================================================================

markers =
    fast: Fast tests that complete in under 1 second
    slow: Slow tests that may take significant time
    unit: Unit tests for individual functions
    integration: Integration tests across modules
    pipeline: Pipeline infrastructure tests
    uv: UV package manager tests
    jax_stack: JAX + Optax + Flax + pymdp stack validation (core package integrity)
    mcp: MCP audit tests that require module discovery
    performance: Performance and resource usage tests
    core: Core module tests
    recovery: Pipeline recovery tests
    ollama: Ollama daemon-dependent LLM tests (real inference against a local Ollama server)
    env_heavy: Environment-heavy tests that invoke uv sync (venv mutation / resolution risk)

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Log file path is under the root output/ tree and covered by the `*.log`
# gitignore rule, so test runs leave `git status` clean. Kept out of tracked
# dirs on purpose; delete this file block if a per-run debug log is unwanted.
log_file = output/2_tests_output/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# =============================================================================
# WARNING FILTERS
# =============================================================================
filterwarnings =
    # SC-26 ratchet: deprecation classes FAIL the suite instead of being
    # swallowed suite-wide. Fixes go to the in-repo deprecated API usage,
    # not back into this list — do not re-add blanket ignores.
    error::DeprecationWarning
    error::PendingDeprecationWarning
    error::FutureWarning
    # UserWarning stays ignored: sklearn emits voluminous data-conversion /
    # calibration UserWarnings during ML stack tests. Converting these to
    # errors is a tracked follow-up (needs per-module sklearn triage).
    ignore::UserWarning
    # JAX emits this RuntimeWarning when a process that has imported JAX forks
    # (ProcessPoolExecutor on Linux). The forked child workers here run trivial
    # non-JAX scripts, so the deadlock warning is a benign environment artifact.
    ignore:os\.fork\(\) was called\. os\.fork\(\) is incompatible with multithreaded code:RuntimeWarning

# =============================================================================
# USAGE EXAMPLES
# =============================================================================
#
# Run all tests:
#   pytest
#
# Run only fast tests:
#   pytest -m fast
#
# Run with coverage:
#   pytest --cov=gnn --cov-report=html
#
# Debug failing tests:
#   pytest -xvs --pdb
# =============================================================================