name: Local gates

# Gates that were previously runnable only by hand via `just` and wired
# into no workflow (found in the 2026-09-07 local/CI parity audit):
#   - just tokens       (manuscript token/citation integrity)
#   - just skills-health (MCP tool + SKILL.md resolvability)
#
# Deliberately NOT wired here: `just gridworld` — since 2026-09-19 the recipe
# runs the full GridWorld pipeline end-to-end (local Julia toolchains) and
# then validates `scripts/check_pomdp_gridworld_outputs.py output`. The
# run-tree it validates is volatile by design
# (docs/development/output_tracking.md): CI has no committed artifacts to
# check, so this remains a local gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: local-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Pin uv to the Dockerfile bootstrap floor series (UV_VERSION=0.12.0).
          version: "0.12"
          enable-cache: true

      - name: Install dependencies (dev)
        run: uv sync --frozen --extra dev

      - name: Manuscript token audit
        run: uv run --extra dev python scripts/check_manuscript_tokens.py --strict

      - name: Manuscript figure freshness
        run: uv run --extra dev python -m pytest tests/test_manuscript_figure_freshness.py -q -p no:cacheprovider

      - name: MCP + skills resolvability health gate
        run: uv run --extra dev python scripts/check_mcp_skills_health.py --strict

      - name: Doc path reference gate
        run: uv run --extra dev python scripts/check_doc_path_references.py
