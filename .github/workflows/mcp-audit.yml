name: MCP audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: mcp-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mcp-tool-count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: MCP tool count audit
        run: |
          uv run --extra dev python -c "
          import sys
          sys.path.insert(0, 'src')
          from tests.mcp.test_mcp_audit import count_mcp_tools
          count = count_mcp_tools()
          print(f'MCP tool count: {count}')
          assert count > 139, f'MCP tool count {count} is below 140'
          print('OK')
          "