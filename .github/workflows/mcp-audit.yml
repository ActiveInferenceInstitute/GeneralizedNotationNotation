name: MCP audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: mcp-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mcp-tool-count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: MCP tool count audit
        run: |
          uv run --extra dev python -c "
          import sys
          sys.path.insert(0, 'src')
          from tests.mcp.test_mcp_audit import MIN_MCP_TOOLS, count_mcp_tools
          count = count_mcp_tools()
          print(f'MCP tool count: {count}')
          assert count >= MIN_MCP_TOOLS, f'MCP tool count {count} is below {MIN_MCP_TOOLS}'
          print('OK')
          "