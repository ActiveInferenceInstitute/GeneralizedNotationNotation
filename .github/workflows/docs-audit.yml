name: Docs audit

# Main CI skips markdown paths; this workflow keeps link + AGENTS/README parity checks on doc changes.

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "SKILL.md"
      - "docs/development/docs_audit.py"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "SKILL.md"
      - "docs/development/docs_audit.py"
  schedule:
    # Scheduled so external-link rot is caught without per-PR network flakiness.
    - cron: "0 6 * * 1"

  workflow_dispatch:
concurrency:
  group: docs-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Match exact uv 0.13.1 in uv.toml and the Docker bootstrap.
          version: "0.13.1"
          enable-cache: true

      - name: Install dependencies (dev)
        run: uv sync --frozen --extra dev

      - name: Documentation audit (strict)
        run: uv run --extra dev python docs/development/docs_audit.py --strict --check-anchors --no-write

      - name: Repository terminology audit
        run: uv run --extra dev python scripts/check_repo_terminology.py --strict

      - name: Maintained documentation terminology audit
        run: uv run --extra dev python scripts/check_maintained_doc_terms.py --strict

      - name: GNN documentation pattern audit
        run: uv run --extra dev python scripts/check_gnn_doc_patterns.py --strict

      - name: External link audit (weekly job)
        if: github.event_name == 'schedule'
        run: uv run --extra dev python scripts/check_external_links.py --strict --allow-hosts doi.org zenodo.org
