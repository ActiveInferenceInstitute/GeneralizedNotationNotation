annotation: "A continuous-state Active Inference agent whose dynamics carry explicit\
  \ process\nand observation noise, rendered as a native linear-Gaussian state-space\
  \ model\n(LGSSM). The agent runs passively — it has no control input:\n- Hidden\
  \ state x = (position, velocity): the Euler-discretized (dt = 0.1) SDE.\n- Observation\
  \ y: two noisy readouts, both reading the position.\n- Q is the process-noise covariance\
  \ (inverse process precision); R is the\n  observation-noise covariance (inverse\
  \ observation precision)."
