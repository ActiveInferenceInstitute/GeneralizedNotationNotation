<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GNN Pipeline Performance Dashboard</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --bg: #0f172a; --surface: #1e293b; --border: #334155;
  --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6;
  --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 32px; }
.header { margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
.header h1 { font-size: 28px; font-weight: 700; color: #fff; }
.header p { color: var(--muted); margin-top: 8px; }

.metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; margin-bottom: 40px; }
.metric-card { background: var(--surface); padding: 24px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
.metric-value { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
.metric-label { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }

.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-bottom: 40px; }
.chart-container { background: var(--surface); padding: 24px; border-radius: 12px; border: 1px solid var(--border); }
.chart-container h2 { font-size: 18px; margin-bottom: 16px; color: #fff; }

.gantt-container { background: var(--surface); padding: 24px; border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; margin-bottom: 40px; }
.gantt-container h2 { font-size: 18px; margin-bottom: 16px; color: #fff; }
#gantt-chart { min-width: 800px; height: 400px; }
</style>
</head>
<body>

<div class="header">
  <h1>GNN Pipeline Performance</h1>
  <p id="dashboard-meta">Loading execution metrics...</p>
</div>

<div class="metrics-grid">
  <div class="metric-card">
    <div class="metric-value" id="val-health" style="color: var(--success)">--</div>
    <div class="metric-label">Overall Health Score</div>
  </div>
  <div class="metric-card">
    <div class="metric-value" id="val-duration" style="color: var(--accent)">--</div>
    <div class="metric-label">Total Duration (s)</div>
  </div>
  <div class="metric-card">
    <div class="metric-value" id="val-memory" style="color: var(--warning)">--</div>
    <div class="metric-label">Peak Memory (MB)</div>
  </div>
  <div class="metric-card">
    <div class="metric-value" id="val-errors" style="color: var(--danger)">--</div>
    <div class="metric-label">Total Errors</div>
  </div>
</div>

<div class="charts-grid">
  <div class="chart-container">
    <h2>Step Duration Distribution</h2>
    <canvas id="durationChart"></canvas>
  </div>
  <div class="chart-container">
    <h2>Memory Usage Profile</h2>
    <canvas id="memoryChart"></canvas>
  </div>
</div>

<div class="gantt-container">
  <h2>Execution Gantt Chart (D3.js)</h2>
  <div id="gantt-chart"></div>
</div>

<script>
// SUMMARY_JSON is injected by the dashboard renderer.
const rawData = {"run_hash": "986210360343", "file_hashes": {"D02-messageix-wrapper.gnn.md": "19ce44383ce9e56c141c00373606db6aa2c777eee3381f3f2f3c1b83223cfb5b", "D03-sturm-wrapper.gnn.md": "dcd4c27ae4ed9244723e41219ff8eba0eab7ff1126400443960d20dd0a5be2f9"}, "start_time": "2026-09-13T14:42:52.234787", "arguments": {"target_dir": "/tmp/gnn-wrappers", "output_dir": "output", "recursive": true, "verbose": false, "log_format": "human", "enable_round_trip": false, "enable_cross_format": false, "skip_steps": null, "only_steps": "3", "parallel": false, "autonomous": false, "strict": false, "estimate_resources": false, "profile": false, "simulate_error": false, "registry_path": null, "query_ontology": null, "ontology_terms_file": "src/ontology/act_inf_ontology_terms.json", "pipeline_summary_file": "output/00_pipeline_summary/pipeline_execution_summary.json", "llm_tasks": null, "llm_timeout": null, "website_html_filename": null, "recreate_venv": false, "dev": true, "setup_core_only": false, "install_optional": false, "optional_groups": null, "frameworks": "all", "strict_framework_success": false, "render_output_dir": null, "distributed": false, "execution_workers": 1, "backend": "ray", "serialize_preset": "full", "execution_benchmark_repeats": 1, "execution_summary_detail": false, "duration": 30.0, "audio_backend": "auto", "sonification": true, "full_analysis": false, "fast_only": true, "include_performance": false, "comprehensive": false, "skip_llm": false, "viz_type": "all", "interactive": false, "export_formats": ["html", "json"], "headless": false, "gui_types": "gui_1,gui_2", "open_browser": false, "analysis_model": null, "bottleneck_threshold": 60.0, "install_all_extras": false, "performance_mode": "low", "mcp_strict_validation": false, "mcp_cache_ttl": null, "mcp_per_module_timeout": null, "mcp_overall_timeout": null, "mcp_modules_allowlist": null, "timesteps": null, "simulation_params": "{}", "timeout": 300, "advanced_stats": false, "generate_animations": true}, "steps": [{"status": "SUCCESS", "stdout": "2026-09-13 14:42:54,120 [7975aa9b:3_gnn] 3_gnn.py - INFO - \ud83d\ude80 Starting step: Processing GNN files with full multi-format generation\n2026-09-13 14:42:54,122 [7975aa9b:3_gnn] 3_gnn.py - INFO - Initialized GNN parsing system with 22 supported formats (full preset emits 22 serializers)\n2026-09-13 14:42:54,122 [7975aa9b:3_gnn] 3_gnn.py - INFO - Available serializers: [<GNNFormat.MARKDOWN: 'markdown'>, <GNNFormat.JSON: 'json'>, <GNNFormat.XML: 'xml'>, <GNNFormat.YAML: 'yaml'>, <GNNFormat.SCALA: 'scala'>, <GNNFormat.PROTOBUF: 'protobuf'>, <GNNFormat.PKL: 'pkl'>, <GNNFormat.XSD: 'xsd'>, <GNNFormat.ASN1: 'asn1'>, <GNNFormat.LEAN: 'lean'>, <GNNFormat.COQ: 'coq'>, <GNNFormat.PYTHON: 'python'>, <GNNFormat.BNF: 'bnf'>, <GNNFormat.EBNF: 'ebnf'>, <GNNFormat.ISABELLE: 'isabelle'>, <GNNFormat.MAXIMA: 'maxima'>, <GNNFormat.ALLOY: 'alloy'>, <GNNFormat.Z_NOTATION: 'z_notation'>, <GNNFormat.TLA_PLUS: 'tla_plus'>, <GNNFormat.AGDA: 'agda'>, <GNNFormat.HASKELL: 'haskell'>, <GNNFormat.PICKLE: 'pickle'>]\n2026-09-13 14:42:54,123 [7975aa9b:3_gnn] 3_gnn.py - INFO - Found 2 potential GNN files\n2026-09-13 14:42:54,123 [7975aa9b:3_gnn] 3_gnn.py - INFO - Processing: /tmp/gnn-wrappers/D03-sturm-wrapper.gnn.md\n2026-09-13 14:42:55,250 [7975aa9b:3_gnn] 3_gnn.py - INFO - Generated 22 formats for D03-sturm-wrapper.gnn.md\n2026-09-13 14:42:55,250 [7975aa9b:3_gnn] 3_gnn.py - INFO - Processing: /tmp/gnn-wrappers/D02-messageix-wrapper.gnn.md\n2026-09-13 14:42:56,661 [7975aa9b:3_gnn] 3_gnn.py - INFO - Generated 22 formats for D02-messageix-wrapper.gnn.md\n2026-09-13 14:42:56,735 [7975aa9b:3_gnn] 3_gnn.py - INFO - \u2705 Processed 2 files, generated 44 format instances across 22 formats (preset=full)\n", "stderr": "", "memory_usage_mb": 36.03125, "peak_memory_mb": 36.03125, "memory_delta_mb": 0.09375, "exit_code": 0, "retry_count": 0, "prerequisite_check": true, "dependency_warnings": [], "recoverable": false, "step_number": 1, "script_name": "3_gnn.py", "description": "GNN file processing", "start_time": "2026-09-13T14:42:52.395104", "end_time": "2026-09-13T14:42:56.769444", "duration_seconds": 4.374336004257202}], "end_time": "2026-09-13T14:42:56.770276", "overall_status": "SUCCESS", "total_duration_seconds": 4.535489, "environment_info": {"python_version": "3.11.15 (main, Jul 18 2026, 16:57:24) [Clang 22.1.3 ]", "platform": "darwin", "cpu_count": 14, "working_directory": "/Volumes/external_drive/Git/projects/ongoing/instituteos/repos/NEST-workspace/models/active_inference/gnn", "user": "4d", "memory_total_gb": "24.0", "disk_free_gb": "58.6"}, "performance_summary": {"peak_memory_mb": 36.03125, "total_steps": 1, "failed_steps": 0, "critical_failures": 0, "successful_steps": 1, "warnings": 0}};

document.addEventListener("DOMContentLoaded", () => {
    try {
        if (!rawData || !rawData.steps) {
            document.getElementById('dashboard-meta').innerText = 'No valid execution data found.';
            return;
        }

        // 1. Populate Header & Metrics
        document.getElementById('dashboard-meta').innerText = `Execution ID: ${rawData.process_id || 'Unknown'} | Timestamp: ${rawData.timestamp || ''}`;
        
        // Derive a health score when Step 24 has not produced one yet.
        const health = rawData.health_score || (100 - (rawData.failures ? rawData.failures.length : 0) * 10);
        document.getElementById('val-health').innerText = `${health}/100`;
        // Color code health
        document.getElementById('val-health').style.color = health > 80 ? 'var(--success)' : health > 50 ? 'var(--warning)' : 'var(--danger)';

        document.getElementById('val-duration').innerText = (rawData.total_duration_seconds || rawData.total_duration || 0).toFixed(2);
        
        // Find Peak Memory
        const maxMem = Math.max(...rawData.steps.map(s => s.memory_mb || 0).filter(v => v));
        document.getElementById('val-memory').innerText = maxMem > 0 ? maxMem.toFixed(1) : 'N/A';
        
        const errs = rawData.failures ? rawData.failures.length : 0;
        document.getElementById('val-errors').innerText = errs;


        // 2. Prepare Chart Data
        const labels = rawData.steps.map(s => s.name);
        const durations = rawData.steps.map(s => Math.max(0, s.duration_seconds || 0));
        const memories = rawData.steps.map(s => Math.max(0, s.memory_mb || 0));

        // 3. Duration Chart (Chart.js)
        new Chart(document.getElementById('durationChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Duration (seconds)',
                    data: durations,
                    backgroundColor: 'rgba(59, 130, 246, 0.8)',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { 
                    y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' } },
                    x: { ticks: { maxRotation: 45, minRotation: 45 }, grid: { display: false } }
                }
            }
        });

        // 4. Memory Chart (Chart.js)
        new Chart(document.getElementById('memoryChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Memory (MB)',
                    data: memories,
                    borderColor: 'rgba(245, 158, 11, 0.8)',
                    backgroundColor: 'rgba(245, 158, 11, 0.1)',
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { 
                    y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' } },
                    x: { ticks: { maxRotation: 45, minRotation: 45 }, grid: { display: false } }
                }
            }
        });

        // 5. Build D3 Gantt Chart
        const ganttDiv = d3.select("#gantt-chart");
        const width = 800;
        const height = rawData.steps.length * 30 + 50;

        const svg = ganttDiv.append("svg")
            .attr("width", "100%")
            .attr("height", height)
            .style("background", "var(--surface)");

        // We build cumulative start times
        let currentStart = 0;
        const ganttData = rawData.steps.map(s => {
            const dur = Math.max(0.1, s.duration_seconds || 0); // min 0.1s for visibility
            const item = {
                name: s.name,
                status: s.status,
                start: currentStart,
                duration: dur,
                end: currentStart + dur
            };
            currentStart += dur;
            return item;
        });

        const xScale = d3.scaleLinear()
            .domain([0, currentStart])
            .range([200, width - 40]);

        const yScale = d3.scaleBand()
            .domain(ganttData.map(d => d.name))
            .range([0, height - 30])
            .padding(0.2);

        // Name Labels
        svg.selectAll(".gantt-label")
            .data(ganttData)
            .enter().append("text")
            .attr("x", 190)
            .attr("y", d => yScale(d.name) + yScale.bandwidth() / 2 + 4)
            .attr("text-anchor", "end")
            .attr("fill", "#94a3b8")
            .attr("font-size", "12px")
            .text(d => d.name.length > 25 ? d.name.substring(0,25)+'...' : d.name);

        // Bars
        svg.selectAll(".gantt-bar")
            .data(ganttData)
            .enter().append("rect")
            .attr("x", d => xScale(d.start))
            .attr("y", d => yScale(d.name))
            .attr("width", d => Math.max(2, xScale(d.end) - xScale(d.start))) // Min 2px width
            .attr("height", yScale.bandwidth())
            .attr("rx", 4)
            .attr("fill", d => {
                const s = String(d.status).toLowerCase();
                if (s.includes("success") || s.includes("passed")) return "#22c55e";
                if (s.includes("warn")) return "#f59e0b";
                if (s.includes("fail") || s.includes("error")) return "#ef4444";
                return "#3b82f6";
            })
            .style("opacity", 0.9);

        // Duration overlay inside/next to bar
        svg.selectAll(".gantt-dur")
            .data(ganttData)
            .enter().append("text")
            .attr("x", d => xScale(d.end) + 5)
            .attr("y", d => yScale(d.name) + yScale.bandwidth() / 2 + 4)
            .attr("fill", "#64748b")
            .attr("font-size", "10px")
            .text(d => d.duration.toFixed(2) + "s");

    } catch (err) {
        console.error(err);
        document.getElementById('dashboard-meta').innerText = 'Error initializing dashboard visuals.';
    }
});
</script>
</body>
</html>
