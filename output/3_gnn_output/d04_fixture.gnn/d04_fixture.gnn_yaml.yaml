annotation: "Passive linear-Gaussian state-space model (no control input) generating\
  \ the\nsummary indices of the D02 MESSAGEix wrapper blanket over T coupling iterations.\n\
  - Hidden state x = (decarb_rate_dev, demand_pressure), dimensionless deviations.\n\
  - Observation y = (emissions_index, price_index, objective_index, demand_index):\
  \ relative indices of total\n  emissions e, mean commodity price p, objective J\
  \ and mean demand d against\n  fixed reference values (see the fixture JSON, `blanket.references`).\n\
  - cap (emissions cap) is a declared exogenous schedule in the fixture, not a\n \
  \ variable of this model.\nDeliverable D04 (AII); pattern for D07 (3–5 states) and\
  \ D14 (GNN → RxInfer render)."
